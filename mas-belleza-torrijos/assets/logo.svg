<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#99f6e4" stop-opacity="0.3" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dynamic Swirling Halo / Ring matching storefront window -->
  <path d="M 60,82 C 50,42 160,26 270,30 C 370,34 430,55 425,82 C 420,112 330,126 220,124 C 110,122 70,105 60,82 Z"
        fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85" />
  <path d="M 120,40 C 230,22 360,35 410,65"
        fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- + symbol and Belleza text in unified brand style -->
  <g id="brand-text" fill="url(#tealGrad)" style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700;">
    <!-- Cross + -->
    <path d="M 105,74 L 117,74 L 117,62 L 127,62 L 127,74 L 139,74 L 139,84 L 127,84 L 127,96 L 117,96 L 117,84 L 105,84 Z" fill="url(#tealGrad)" />
    
    <!-- Word Belleza -->
    <text x="142" y="93" font-size="52" letter-spacing="-0.5" font-style="italic">Belleza</text>
  </g>

  <!-- Tagline below -->
  <text x="250" y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="4.5" fill="#475569" text-anchor="middle">CENTRO DE ESTÉTICA · TORRIJOS</text>
</svg>